[build-system]
requires = ["uv_build==0.12.13"]
build-backend = "uv_build"

[project]
name = "arbiscan"
version = "0.1.0.dev0"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
required-version = "==0.12.12"
package = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
