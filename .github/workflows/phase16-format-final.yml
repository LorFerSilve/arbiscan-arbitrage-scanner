name: Phase 16.2 final formatting

on:
  push:
    branches: [codex/phase-16-2-provenance-hardening]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/phase-16-2-provenance-hardening

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.12"
          python-version: "3.13.15"

      - name: Format Phase 16.2 Python files
        run: |
          uvx --from ruff==0.16.7 ruff format \
            src/arbiscan/domain/models.py \
            src/arbiscan/domain/serialization.py \
            src/arbiscan/normalization/strict.py \
            src/arbiscan/ingestion/__init__.py \
            src/arbiscan/ingestion/multisource.py \
            src/arbiscan/ingestion/multisource_state.py \
            src/arbiscan/services/__init__.py \
            src/arbiscan/services/multisource_realtime_scanner.py \
            tests/unit/domain/test_phase16_serialization_migration.py \
            tests/unit/ingestion/test_phase16_multisource.py \
            tests/unit/ingestion/test_phase16_multisource_state.py \
            tests/integration/test_phase16_multisource_realtime.py \
            tests/unit/test_phase16_persistence_provenance.py
          uvx --from ruff==0.16.7 ruff check --fix \
            src/arbiscan/domain/models.py \
            src/arbiscan/domain/serialization.py \
            src/arbiscan/normalization/strict.py \
            src/arbiscan/ingestion/__init__.py \
            src/arbiscan/ingestion/multisource.py \
            src/arbiscan/ingestion/multisource_state.py \
            src/arbiscan/services/__init__.py \
            src/arbiscan/services/multisource_realtime_scanner.py \
            tests/unit/domain/test_phase16_serialization_migration.py \
            tests/unit/ingestion/test_phase16_multisource.py \
            tests/unit/ingestion/test_phase16_multisource_state.py \
            tests/integration/test_phase16_multisource_realtime.py \
            tests/unit/test_phase16_persistence_provenance.py

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/arbiscan tests
          git commit -m "style: format final Phase 16.2 changes"
          git push origin HEAD:codex/phase-16-2-provenance-hardening
