name: Phase 16.2 one-shot format

on:
  push:
    branches: [codex/phase-16-2-provenance-hardening]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/phase-16-2-provenance-hardening

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.12"
          python-version: "3.13.15"

      - name: Format changed Python files
        run: |
          uvx --from ruff==0.16.7 ruff format \
            src/arbiscan/domain/models.py \
            src/arbiscan/domain/serialization.py \
            src/arbiscan/normalization/strict.py \
            src/arbiscan/ingestion/multisource.py \
            tests/unit/domain/test_phase16_serialization_migration.py \
            tests/unit/ingestion/test_phase16_multisource.py
          uvx --from ruff==0.16.7 ruff check --fix \
            src/arbiscan/domain/models.py \
            src/arbiscan/domain/serialization.py \
            src/arbiscan/normalization/strict.py \
            src/arbiscan/ingestion/multisource.py \
            tests/unit/domain/test_phase16_serialization_migration.py \
            tests/unit/ingestion/test_phase16_multisource.py

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/arbiscan/domain/models.py src/arbiscan/domain/serialization.py \
            src/arbiscan/normalization/strict.py src/arbiscan/ingestion/multisource.py \
            tests/unit/domain/test_phase16_serialization_migration.py \
            tests/unit/ingestion/test_phase16_multisource.py
          git commit -m "style: format Phase 16.2 provenance changes"
          git push origin HEAD:codex/phase-16-2-provenance-hardening
