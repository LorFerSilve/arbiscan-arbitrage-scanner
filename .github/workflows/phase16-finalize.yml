name: Phase 16.2 finalization

on:
  push:
    branches: [codex/phase-16-2-provenance-hardening]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/phase-16-2-provenance-hardening

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.12"
          python-version: "3.13.15"

      - name: Apply Phase 16.2 realtime integration
        run: python scripts/phase16_finalize_patch.py

      - name: Format and lint modified Python files
        run: |
          uvx --from ruff==0.16.7 ruff format \
            src/arbiscan/ingestion/realtime.py \
            src/arbiscan/ingestion/__init__.py \
            src/arbiscan/services/realtime_scanner.py \
            src/arbiscan/services/observable_realtime_scanner.py \
            src/arbiscan/observability/runtime.py \
            tests/integration/test_phase16_multisource_realtime.py \
            tests/unit/test_phase16_persistence_provenance.py
          uvx --from ruff==0.16.7 ruff check --fix \
            src/arbiscan/ingestion/realtime.py \
            src/arbiscan/ingestion/__init__.py \
            src/arbiscan/services/realtime_scanner.py \
            src/arbiscan/services/observable_realtime_scanner.py \
            src/arbiscan/observability/runtime.py \
            tests/integration/test_phase16_multisource_realtime.py \
            tests/unit/test_phase16_persistence_provenance.py

      - name: Install project
        run: uv sync --locked

      - name: Run strict typing and tests
        run: |
          uv run --with mypy==2.3.1 mypy src tests scripts
          uv run --with pytest==9.1.1 pytest

      - name: Commit Phase 16.2 completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/arbiscan/ingestion/realtime.py src/arbiscan/ingestion/__init__.py \
            src/arbiscan/services/realtime_scanner.py \
            src/arbiscan/services/observable_realtime_scanner.py \
            src/arbiscan/observability/runtime.py \
            tests/integration/test_phase16_multisource_realtime.py \
            tests/unit/test_phase16_persistence_provenance.py \
            docs/providers/phase-16-readiness.md docs/development/README.md \
            docs/development/phase-16.2-completion.md
          git commit -m "feat: complete Phase 16.2 realtime provenance hardening"
          git push origin HEAD:codex/phase-16-2-provenance-hardening
